name: Windows build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify plugin fixture runtime
        run: node -e "if (typeof WebSocket !== 'function') process.exit(1)"
      - name: Build native executables
        run: cargo build --release --locked
      - name: Rust and headless MCP tests
        env:
          DECKFORGE_MCP_EXE: ${{ github.workspace }}\target\release\deckforge-mcp.exe
        run: cargo test --locked
      - name: MCP stdio transport
        run: node tests/mcp-transport.cjs
      - name: MCP HTTP transport
        run: node tests/mcp-http.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: DeckForge-Windows
          path: |
            target/release/deckforge.exe
            target/release/deckforge-mcp.exe
            LICENSE
            THIRD-PARTY-NOTICES.txt
            README.md
            docs/MCP.md
