name: Windows build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      DECKFORGE_MCP_EXE: ${{ github.workspace }}\target\release\deckforge-mcp.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify plugin fixture runtime
        run: node -e "if (typeof WebSocket !== 'function') process.exit(1)"
      - name: Build native executables
        run: cargo build --release --locked
      - name: Build tests
        run: cargo test --locked --no-run
      - name: Diag plugin_host
        timeout-minutes: 6
        continue-on-error: true
        run: "cargo test --locked plugin_host:: -- --test-threads=1"
      - name: Diag plugin_validation
        timeout-minutes: 6
        continue-on-error: true
        run: "cargo test --locked plugin_validation:: -- --test-threads=1"
      - name: Diag plugin_validation_proxy
        timeout-minutes: 6
        continue-on-error: true
        run: "cargo test --locked plugin_validation_proxy:: -- --test-threads=1"
      - name: Diag other plugin modules
        timeout-minutes: 6
        continue-on-error: true
        run: "cargo test --locked plugin_http:: plugin_import:: plugin_runtime:: plugins:: plugin_catalog:: -- --test-threads=1"
      - name: Diag ui
        timeout-minutes: 8
        continue-on-error: true
        run: "cargo test --locked ui:: -- --test-threads=1"
      - name: Diag assistants
        timeout-minutes: 6
        continue-on-error: true
        run: "cargo test --locked assistant:: -- --test-threads=1"
      - name: Diag remaining
        timeout-minutes: 8
        continue-on-error: true
        run: "cargo test --locked -- --test-threads=1 --skip plugin_ --skip plugins:: --skip ui:: --skip assistant::"
