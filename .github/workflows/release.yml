name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build native executables
        run: cargo build --release --locked
      - name: Rust and headless MCP tests
        timeout-minutes: 20
        env:
          DECKFORGE_MCP_EXE: ${{ github.workspace }}\target\release\deckforge-mcp.exe
        shell: pwsh
        run: ./tools/ci-test.ps1
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $name = "DeckForge-$version"
          New-Item -ItemType Directory -Force dist/$name/docs | Out-Null
          Copy-Item target/release/deckforge.exe, target/release/deckforge-mcp.exe, LICENSE, THIRD-PARTY-NOTICES.txt, README.md dist/$name/
          Copy-Item docs/MCP.md, docs/PLUGINS-COMPATIBILITE.md, docs/DESIGN.md dist/$name/docs/
          Copy-Item docs/images -Destination dist/$name/docs/images -Recurse
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name-Windows.zip
          git archive --format=zip --prefix="$name/" -o dist/$name-source.zip HEAD
          $hashes = [ordered]@{}
          foreach ($f in Get-ChildItem dist -Filter *.zip) { $hashes[$f.Name] = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() }
          $hashes | ConvertTo-Json | Set-Content -Encoding utf8 dist/$name-sha256.json
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $known = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not $known) { choco install innosetup -y --no-progress }
          ./tools/Build-Installer.ps1 -Version $env:VERSION
          Copy-Item "target/release-dist/DeckForge-$env:VERSION-Setup.exe", "target/release-dist/DeckForge-$env:VERSION-Setup.exe.sha256" dist/
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/RELEASE-$env:VERSION.md"
          if (-not (Test-Path $notes)) { $notes = "README.md" }
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist -File).FullName --title "DeckForge $env:VERSION" --notes-file $notes --verify-tag
