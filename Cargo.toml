[package]
name = "deckforge"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "Independent Windows macro controller for FIFINE D6 3142:0060"

[dependencies]
anyhow = "1"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
sha2 = "0.10"
base64 = "0.22"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "=9.0.4", default-features = false, features = ["deflate"] }
tempfile = "3"
wry = { version = "=0.57.0", default-features = false }
webview2-com = "=0.39.1"
windows62 = { package = "windows", version = "=0.62.2", features = ["Win32_System_Com"] }
tao = { version = "=0.37.1", default-features = false, features = ["rwh_06"] }
url = "2"
getrandom = "0.4"
resvg = { version = "=0.45.1", default-features = false }
raw-window-handle = "0.6"
rfd = "0.15"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Media_Multimedia", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_Memory"] }
windows = { version = "=0.58.0", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Variant", "Win32_Foundation", "Win32_Media_MediaFoundation"] }

[profile.release]
opt-level = 2
strip = true


